# ai_ops active crew profile (factory default)
# Managed by /profiles command. Do not edit generated derivatives manually.
# Run /profiles to modify and regenerate derivative files.

schema_version: "0.1.0"
generated_at: "2026-04-12T00:00:00Z"

crew_preset: "default"

lead_agent:
  rider: null
  overrides: {}

subagents:
  ai-ops-planner:
    rider: "logike"
    model: "sonnet"
    background: false
    overrides: {}
  ai-ops-executor:
    rider: "forge"
    model: "sonnet"
    background: false
    overrides: {}
  ai-ops-builder:
    rider: "forge"
    model: "sonnet"
    background: false
    overrides:
      conservatism: 60
      initiative: 35
  ai-ops-reviewer:
    rider: "anchor"
    model: "opus"
    background: false
    overrides: {}
    hooks:
      PreToolUse:
        - matcher: "Edit|Write"
          hooks:
            - type: command
              command: >-
                input=$(cat);
                fp=$(printf '%s' "$input" | grep -o '"file_path"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed -E 's/.*"file_path"[[:space:]]*:[[:space:]]*"([^"]*)"/\1/');
                if [ -z "$fp" ];
                then echo "[REVIEWER GUARD] Blocked: no file_path found in tool_input — failing closed." >&2;
                exit 2;
                fi;
                npath=$(printf '%s' "$fp" | tr '\\\\' '/');
                if ! printf '%s' "$npath" | grep -qE '(^|/)(90_Sandbox|99_Trash)(/|$)|(^|/)\.ai_ops/local(/|$)';
                then echo "[REVIEWER GUARD] Write outside sandbox blocked: $fp — reviewer lane is read/report-only except in sandbox." >&2;
                exit 2;
                fi; exit 0
  ai-ops-researcher:
    rider: "scout"
    model: "sonnet"
    background: false
    overrides: {}
  ai-ops-closer:
    rider: "forge"
    model: "sonnet"
    background: false
    overrides:
      conservatism: 80
      initiative: 20
  ai-ops-linter:
    rider: "anchor"
    model: "haiku"
    background: true
    overrides:
      autonomy: 70
