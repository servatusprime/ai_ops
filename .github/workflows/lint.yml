name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24.21.0'

      - name: Install lint dependencies
        run: |
          pip install pyyaml yamllint ruff
          npm ci --ignore-scripts --omit=dev --prefix .github/tools/markdownlint

      - name: Verify repo structure map is current
        run: |
          python 00_Admin/scripts/generate_repo_structure.py --repo-root .
          git diff --exit-code -- repo_structure.txt

      - name: Run canonical release-quality gate
        run: python 00_Admin/scripts/run_release_quality_gate.py
