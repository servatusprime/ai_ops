  - id: fw_20260726_01
    title: Runprogram wiring audit as a scoped health gate
    domain: validation
    target_repo: both
    source_workbook: >-
      <governed_repo>/90_Sandbox/ai_workbooks/work_program_gis_work_program_01/work_packets/wp_gis_runprogram_thrift_and_resource_audit_01_2026-07-20/wb_gis_runprogram_thrift_and_resource_audit_01.md
    completion_workbook: null
    proposed_workbook: >-
      99_Trash/wb_ai_ops_command_surface_uplift_01_2026-09-02/wb_01_health_command_pilot_2026-09-02.md
    scope: >-
      Extend the governed health orchestration so a selected runprogram scope
      invokes that runprogram's registered static wiring validator before
      reporting the run-family healthy. The initial reference implementation is
      `validate_due_diligence_runner_templates.py` in the governed GIS module:
      it validates RB-1 through RB-6 runner-template presence, mandatory step
      order, executable resolution, and critical entry/exit handoffs. It must
      catch the concrete regressions that escaped the 2026-07-24 health sweep:
      a declared layer-removal profile never called by RB-4, a controller
      refresh path that cannot overwrite an in-use atlas GeoPackage, missing
      fetch/presentation-profile inputs, and RB-5 lineage consuming an
      ambiguous rather than RB-4 live-theme receipt. Generalize the health hook
      through an explicit validator registration/discovery field; do not
      hard-code a GIS command into generic ai_ops health logic. The health lane
      remains read-only: a wiring failure is reported with affected milestone,
      missing or misordered step, and broken handoff; remediation routes to
      `/work`. Add negative fixtures for omitted cleanup, wrong seed/override
      order, missing RB-5 atlas rebuild, and disconnected receipts. Keep this
      static audit distinct from a materialized live run, QGIS visual review,
      or project acceptance, which remain downstream execution gates. Expand
      the registration contract beyond step presence/order: a cartographic
      runbundle must also prove that each declared reusable style authority is
      consumed by an application step, that its project mapping covers the
      declared required compatible roles, and that any apply-time style values
      are sourced from (or parity-checked against) the same canonical contract
      used by the validator. The 2026-07-26 seed-project replay exposed both gaps:
      RB-4 called the seed-transfer tool but its mapping carried only one of
      seven previously established compatible authorities, and the soil no-data
      values applied by the tuning helper drifted from the values validated in
      `cartographic_conventions.yaml`. Report these as wiring/application
      parity failures, not successful health merely because executables and
      receipts exist. Negative fixtures must include an under-covered mapping,
      a style catalog/profile authority that is never consumed, and divergent
      apply-versus-validate values. Extend the generic registration contract
      for imagery-dependent runbundles: verify a receipted source is consumed
      by a local-materialization step, the output raster is bound into every
      declared imagery theme, and the gate runs before layout/export. Include
      an asset-neutrality audit for canonical templates/configuration/docs so
      named seed projects, jurisdiction palettes, layer names, and project
      paths cannot leak from a seed into reusable runprogram controls. The
      audit must derive its project identifiers from the governed project root
      or registered inventory rather than baking those names into ai_ops.
    priority: high
    benefit: high
    effort: m
    readiness: ready
    risk_if_deferred: high
    activation_trigger: >-
      Any health review covering a runprogram/runbundle family, or a future
      finding where declared validators and files exist but the build path does
      not apply or hand off the required control.
    next_review: 2026-12-15
    status: planned
    owner: ai_ops
    created: 2026-07-26
    compacted_context:
      source: >-
        Governed GIS runprogram wiring remediation, 2026-07-26
      note: >-
        The comprehensive health report correctly found structural graph gaps
        but did not execute the runprogram-specific wiring validator. Later
        Seed-project traces proved that JSON/template validity alone missed an
        unwired cleanup/atlas-refresh path, incomplete compatible-style
        transfer coverage, and a duplicate apply-time soil palette that had
        drifted from the canonical validator contract.
    notes: >-
      Requires a dedicated approved ai_ops implementation workbook because it
      changes shared health behavior and validator registration. Preserve
      generic governed-repo discovery; the initial GIS validator is evidence,
      not the generic health contract itself.
      UPDATE 2026-09-04: folded into
      `wb_ai_ops_command_surface_uplift_01_2026-09-02` Workbook 01 (`/health`
