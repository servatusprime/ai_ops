  - id: fw_20260619_02
    title: Reduce git permission-prompt friction (atomic invocation convention + git rebase allowlist)
    domain: operations
    target_repo: both
    source_workbook: >-
      ai_ops/90_Sandbox/ai_workbooks/scratchpad_stop_approvals_2026-06-12.md
    completion_workbook: null
    proposed_workbook: null
    scope: >-
      Reduce permission-prompt friction for routine git work. Two causes observed
      2026-06-19: (1) agents bundle several commands into one Bash call for
      efficiency, but the permission matcher keys on the whole command string, so a
      bundled call (for example "git add ... ; git commit ... ; git push") does not
      match an atomic Bash(git <verb>:*) allow pattern and prompts even when each
      verb is individually allowlisted; (2) git rebase is absent from the default
      allowlist, and divergence integration is routine. Two-part fix: (a) document
      an atomic single-command git-invocation convention in agent operating
      guidance (one allowlisted command per Bash call for git mutations) so the
      allowlist is actually leveraged; (b) add Bash(git rebase:*) to the default
      permission allowlist template, or split integration into allowlisted steps.
      Benefits all agents and platforms.
    priority: medium
    benefit: medium
    effort: s
    readiness: ready
    risk_if_deferred: low
    activation_trigger: >-
      Recurring permission prompts during multi-step git operations (commit/push/
      rebase) despite the verbs being allowlisted.
    next_review: 2026-12-15
    status: planned
    owner: ai_ops
    created: 2026-06-19
    compacted_context:
      source: >-
        Observed 2026-06-19 during cross-repo closeouts: bundled git Bash calls and
        an un-allowlisted git rebase prompted the operator even though commit/push
        were allowlisted. Operator asked to capture as a cross-agent seed, not a
        private agent memo.
      note: >-
        Pairs with the stop-approvals inventory. The convention half is agent
        operating guidance; the allowlist half is a settings/template change.
    notes: >-
      Seeded from the 2026-06-19 stop-approval correction; applies to any agent
      doing git work under a permission allowlist.
      Update 2026-10-23: prompt reduction was deferred for the closeout rework (not a focus
      of that patch). Levers recorded here for later: allow read-only `git rev-parse`,
      `git config --get` and read-only `git -C` forms in the settings template while commit
      and push stay prompt-gated; or change workflow command forms to run read-only commands
      from the working directory. If git later runs inside approved scripts (see
      `fw_20261023_01`), the effective per-command prompt gate on commit and push changes and
      must be decided explicitly. Re-open when the operator makes prompt reduction a goal.

