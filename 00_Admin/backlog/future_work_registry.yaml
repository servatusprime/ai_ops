# Registry entry schema reference:
#   id: fw_YYYYMMDD_NN - unique registry entry ID
#   title: short description of the work item
#   domain: governance | tooling | validation | documentation | integration | operations
#   target_repo: ai_ops | governed_repo | both
#   source_workbook: repo-relative path to originating workbook
#   completion_workbook: repo-relative execution workbook that completes the item; null while pending
#   proposed_workbook: repo-relative path to planned workbook (null if not yet proposed)
#   resolution: (optional) why a non-null completion_workbook resolved the item, used when the
#     resolution was supersession rather than delivery; the entry is deleted at closeout per the
#     Completion and Deletion Rule once a success receipt and exact run-log marker exist
#   scope: detailed description of what needs to be done
#   priority: low | medium | high
#   benefit: low | medium | high
#   effort: xs | s | m | l | xl
#   readiness: ready | partial | blocked | deferred
#   risk_if_deferred: low | medium | high
#   activation_trigger: condition or event that re-opens deferred items
#   next_review: YYYY-MM-DD - date to re-evaluate status
#   status: planned | active | deferred | recurring
#   recurrence_trigger: (for status:recurring only) schedule or trigger condition that re-opens the item
#   owner: team or person responsible
#   created: YYYY-MM-DD - date entry was added
#   compacted_context: {source, note} - provenance and context for future agents
#   notes: free-text notes

scorecard_schema:
  purpose: Lightweight benefit-effort-risk triage for future work sorting.
  domain_values:
    - governance
    - tooling
    - validation
    - documentation
    - integration
    - operations
  target_repo_values:
    - ai_ops
    - governed_repo
    - both
  benefit_scale:
    high: Major unblock or risk reduction.
    medium: Useful improvement, not usually blocking.
    low: Nice-to-have.
  effort_scale:
    xs: <=0.5 day
    s: 1 day
    m: 2-3 days
    l: 4-5 days
    xl: 1+ week
  readiness_values:
    - ready
    - partial
    - blocked
    - deferred
  risk_if_deferred_values:
    - high
    - medium
    - low
entries:
  - id: fw_20260315_01
    title: Session-state infrastructure for context routing fast-path evaluation
    domain: integration
    target_repo: ai_ops
    source_workbook: >-
      99_Trash/workbundles_2026-03-15/wb_context_routing_agents_order_01_2026-03-14/wb_context_routing_agents_order_01.md
    completion_workbook: null
    proposed_workbook: null
    scope: >-
      Activate the fast-path conditions and trigger detection contract defined
      in `00_Admin/specs/spec_context_routing_runtime.md` once session-state
      tracking is reliable enough to evaluate them. Compacted context
      (Claude Code built-in conversation summarization) already partially fills
      this role: it carries forward reads_applied, active mode, and target repo
      across the context compression boundary. Remaining gaps: compacted context
      is not machine-queryable (no session_flags API), file hash change
      detection is absent, and resume_same_scope fast-path cannot be evaluated
      without verifiable field presence. When the gap is closed (via compacted
      context improvements, a Claude Code hook, or an MCP server): activate
      fast-path conditions (same_target_repo, mode_unchanged,
      no_reread_trigger_fired), enable trigger detection expressions, wire
      hook_points to an event bus, and migrate activated spec content back into
      context_routing.yaml per the implementation roadmap in
      spec_context_routing_runtime.md. Concrete file changes at that time:
      context_routing.yaml (restore trimmed sections as enforced active config),
      AGENTS.md (conditional bootstrap tier selection), rb_bootstrap.md
      (updated Step 2), validate_repo_rules.py and validator_config.yaml (new
      VS rule for session-state injection), and spec_context_routing_runtime.md
      (retire to 99_Trash once fully migrated).
      Persistent machine-queryable portfolio graph state also belongs in this
      infrastructure lane; the run-family architecture uplift must not create
      a committed portfolio-state graph as a substitute. Before activation,
      evidence must bind the session state to the exact target repository, mode,
      active artifact, HEAD or relevant file hashes, reads_applied set and
      no-reread trigger state; stale or changed bindings must reject
      resume_same_scope and route to fresh_bootstrap. A positive resume fixture,
      stale-context rejection fixture and safe-fallback fixture are required.
    priority: low
    benefit: medium
    effort: xl
    readiness: deferred
    risk_if_deferred: low
    activation_trigger: >-
      A stateful session context mechanism becomes available (e.g., Claude Code
      adds native session memory, an MCP server for ai_ops state tracking is
      built, or equivalent tooling enables cross-turn state evaluation).
    next_review: 2027-01-15
    status: planned
    owner: ai_ops
    created: 2026-03-15
    compacted_context:
      source: >-
        wb_context_routing_agents_order_01 Phase 3 audit; requestor question
        2026-03-15 about session-state infrastructure
      note: >-
        context_routing.yaml was split from spec_context_routing_runtime.md
        to separate active contract from target-state design. The spec holds
