# Registry entry schema reference:
#   id: fw_YYYYMMDD_NN - unique registry entry ID
#   title: short description of the work item
#   domain: governance | tooling | validation | documentation | integration | operations
#   target_repo: ai_ops | governed_repo | both
#   source_workbook: repo-relative path to originating workbook
#   completion_workbook: repo-relative execution workbook that completes the item; null while pending
#   proposed_workbook: repo-relative path to planned workbook (null if not yet proposed)
#   scope: detailed description of what needs to be done
#   priority: low | medium | high
#   benefit: low | medium | high
#   effort: xs | s | m | l | xl
#   readiness: ready | partial | blocked | deferred
#   risk_if_deferred: low | medium | high
#   activation_trigger: condition or event that re-opens deferred items
#   next_review: YYYY-MM-DD - date to re-evaluate status
#   status: planned | active | deferred | recurring
#   recurrence_trigger: (for status:recurring only) schedule or trigger condition that re-opens the item
#   owner: team or person responsible
#   created: YYYY-MM-DD - date entry was added
#   compacted_context: {source, note} - provenance and context for future agents
#   notes: free-text notes

scorecard_schema:
  purpose: Lightweight benefit-effort-risk triage for future work sorting.
  domain_values:
    - governance
    - tooling
    - validation
    - documentation
    - integration
    - operations
  target_repo_values:
    - ai_ops
    - governed_repo
    - both
  benefit_scale:
    high: Major unblock or risk reduction.
    medium: Useful improvement, not usually blocking.
    low: Nice-to-have.
  effort_scale:
    xs: <=0.5 day
    s: 1 day
    m: 2-3 days
    l: 4-5 days
    xl: 1+ week
  readiness_values:
    - ready
    - partial
    - blocked
    - deferred
  risk_if_deferred_values:
    - high
    - medium
    - low
