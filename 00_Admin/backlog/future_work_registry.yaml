  - id: fw_20261106_01
    title: Enforce factory/local profile output isolation before /profiles customization
    domain: tooling
    target_repo: ai_ops
    source_workbook: 90_Sandbox/ai_workbooks/wb_work_workflow_simplification_01_2026-11-03/wb_02_lane_profile_fitness.md
    completion_workbook: null
    proposed_workbook: null
    scope: >-
      Before the first use of `/profiles` customization that can differ from the
      factory profile, define and enforce a safe factory/local output boundary.
      The factory source is
      `02_Modules/01_agent_profiles/base/default_crew.yaml`; the machine-local
      source is `.ai_ops/local/profiles/active_crew.yaml`. The generator is
      `00_Admin/scripts/regenerate_profiles.py`. With no explicit profile,
      `--check` and `--check --tracked-only` validate the factory source. With an
      explicit local profile, a normal generation run can write the tracked
      derivative classes `plugins/ai-ops-governance/agents/**`,
      `02_Modules/01_agent_profiles/generated/**` and `.claude/agents/**` from
      local content. The observed local source differed from factory content
      (including `communication_depth: 25` and comments), so a normal run
      would rewrite 17 tracked derivatives even though the factory tracked-only
      check remained clean. Choose and implement one bounded control before
      customized `/profiles` use: either refuse normal writes to tracked roots
      when an explicit local source differs from factory, or write local
      derivatives only to an exact ignored output root with a named runtime
      consumer. Preserve the factory derivative invariant, document the source
      and consumer boundary, add focused positive and negative checks, and
      verify that a valid local customization leaves factory-tracked hashes
      unchanged. Do not use this item to redesign lanes, retire fields, adopt
      EGM, or edit unrelated canonical workflows.
