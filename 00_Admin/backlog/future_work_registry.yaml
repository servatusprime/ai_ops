  - id: fw_20260716_03
    title: Make Director approval delegation efficient and measurable
    domain: governance
    target_repo: ai_ops
    source_workbook: >-
      90_Sandbox/ai_workbooks/wb_run_family_graph_architecture_uplift_01_2026-07-16/wb_run_family_graph_architecture_uplift_01.md
    completion_workbook: null
    proposed_workbook: >-
      90_Sandbox/ai_workbooks/
      wb_ai_first_operating_model_uplift_review_01_2026-07-13/
      wb_director_approval_delegation_efficiency_01.md
    scope: >-
      Define a machine-verifiable approval receipt issued by the user-facing
      root context that Coordinator and worker approval reviewers can consume
      without restating or inferring authority. Specify an explicit
      root-authorized merge fallback for runtimes that cannot propagate Level-4
      approval. Add Director burden and benefit measures covering time and
      coordination cycles to first canonical change, duplicate gate attempts,
      operator interruptions, context rereads, resume success, prevented scope
      or authority violations, review defects found, and rework avoided.
      Reconcile the applicable governance policy/spec, `/work` and Director
      guides, charter/approval/return templates, validator enforcement,
      fixtures, and protocol evidence. Include simplification and sunset rules
      so controls without a demonstrated failure mode or measurable net benefit
      are automated, narrowed, or removed. Define per-role model routing so the
      strongest model is reserved for low-volume Director decisions and
      independent Level-4 review, while capable lower-cost models own routine
      Coordinator and worker execution. Measure Director body-execution rate,
      escalation rate, model/token/cost by role, and quality-adjusted rework.
    priority: high
    benefit: high
    effort: m
    readiness: ready
    risk_if_deferred: high
    activation_trigger: >-
      Activate after director-run-family-graph-001 closeout, or immediately if
      another Director run repeats a child-context approval rejection.
    next_review: 2026-08-01
    status: planned
    owner: ai_ops
    created: 2026-07-16
    compacted_context:
      source: >-
        Director dogfood run director-run-family-graph-001 operating-model
        feedback and operator burden-control direction
      note: >-
        Three child-context approval rejections delayed canonical execution
        after one explicit operator approval. Root-merge fallback preserved
        authority and progress, but the protocol is not yet efficient enough
        for promotion without approval propagation and burden measurement.
        The current Codex collaboration runtime does not expose per-child model
        selection, so this run cannot validate the intended strong-root and
        lower-cost-worker model topology.
    notes: >-
      Treat protocol compliance as evidence, not success. Promotion requires a
      measured net benefit over Coordinator-only execution and no duplicate
      approval requests for one declared batch.
