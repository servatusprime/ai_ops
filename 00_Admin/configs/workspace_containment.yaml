version: 0.1.0
workspace:
  temp_root: "<workspace-root>/tmp"
overlay_allowlist:
  allow: []
agent_adapters:
  - agent: claude
    mechanism: "guard hook; file tools only; Bash unguarded"
    status: runtime_unverified
    last_verified: 2026-10-16
  - agent: codex
    mechanism: "OS-temp containment NOT enforced; detective report only"
    status: runtime_unverified
    last_verified: 2026-10-16
  - agent: other
    mechanism: "uncovered; no use without OS-level jail"
    status: uncovered
    last_verified: null
harness_exceptions:
  - id: claude-project-memory
    path: "<user-profile>/.claude/projects/<workspace-project>/memory"
    reason: "Claude per-project memory folder derived from the workspace root; the only retained harness exception"
escape_root_signatures:
  - "<os-temp>/ai_ops"
  - "<os-temp>/pytest-of-*"
  - "C:/tmp"
