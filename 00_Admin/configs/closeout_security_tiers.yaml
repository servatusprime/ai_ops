version: "0.8.0"
ruleset_version: "0.8.0"
packet:
  estimated_tokens_per_packet: 20000
  # Review capacity is bounded per packet; aggregate review size is not a
  # closeout admission gate. Workbook loop caps and explicit packet splitting
  # provide the remaining controls.
  session_token_budget: null
  max_total_review_tokens: null
  # Reuse a passing full-file attestation for unchanged large text rows.  The
  # current packet then carries only the bounded source delta and the immutable
  # baseline binding.
  delta_reuse_min_bytes: 20000
  delta_context_lines: 80
  delta_max_bytes: 100000
tiers:
  T0:
    reviewer_model: lowest-available
    reviewer_runtime: ai-ops-reviewer
    path_prefixes:
      - "90_Sandbox/"
      - "99_Trash/"
    allowed_extensions: [".md", ".txt", ".yaml", ".yml", ".json", ".log"]
    review: full_file_batched
    reviewer_guidance: >-
      Disclosed process facts are not findings. Reserve needs_work or escalate
      for a concrete policy, security, or scope defect.
  T1:
    reviewer_model: medium
    reviewer_runtime: ai-ops-reviewer
    path_prefixes:
      - ""
    review: full_file_plus_diff
  T2:
    reviewer_model: maximum
    reviewer_runtime: ai-ops-reviewer
    path_prefixes: []
    review: full_file_plus_diff_plus_independent_pass
forced_t2_prefixes:
  - ".ai_ops/workflows/"
  - "00_Admin/configs/"
  - "00_Admin/policies/"
  - "00_Admin/specs/"
  - "plugins/"
  - ".claude/"
  - ".agents/"
  - "01_Resources/templates/config/"
  - ".githooks/"
forced_t2_files:
  - "AGENTS.md"
  - "CLAUDE.md"
  - ".pre-commit-config.yaml"
  - "SECURITY.md"
  - "00_Admin/scripts/target_paths.py"
generated_prefixes:
  - ".ai_ops/exports/"
  - "00_Admin/reports/generated/"
binary_extensions: [".bin", ".png", ".jpg", ".jpeg", ".gif", ".pdf", ".qgz", ".gpkg", ".zip"]
secret_patterns:
  - "(?i)(api[_-]?key|secret|token|password)\\s*[:=]"
instruction_patterns:
  - "(?i)ignore\\s+(all|previous|prior)\\s+instructions"
additional_tripwires:
  - "(?i)-----BEGIN(?: [A-Z]+)? PRIVATE KEY-----"
  - "(?i)\\b(?:Invoke-Expression|iex)\\b"
  - "(?i)\\b(?:subprocess\\.(?:run|Popen|call)|os\\.system)\\b.*\\bshell\\s*=\\s*True\\b"
  - "(?i)\\b(?:write_text|write_bytes|unlink|remove|move)\\s*\\("
  - '(?i)\b[A-Z]:[\\/]{1,4}Users[\\/]{1,4}(?!<|\$|%|\{|Public\b|Default\b|All Users\b)[^\\/\s<>"''`|]+'
  - "(?i)(?<![\\w.~-])/(?:mnt/)?[A-Z]/Users/(?!<|\\$|%|\\{|Public\\b|Default\\b|All Users\\b)[^/\\s<>\"'`|]+"
large_deleted_data:
  enabled: true
  min_source_bytes: 8388608
  approved_path_patterns:
    - "03_Projects/*/outputs/*"
    - "90_Sandbox/*/outputs/*"
    - "99_Trash/*"
  approved_extensions: [".csv", ".geojson"]
  blocked_structure_keys:
    - "approval_state"
    - "argv"
    - "authority"
    - "command"
    - "commands"
    - "controller"
    - "environment"
    - "executable"
    - "instruction"
    - "instructions"
    - "job"
    - "jobs"
    - "permissions"
    - "recovery"
    - "runner"
    - "script"
    - "scripts"
    - "step"
    - "steps"
    - "workflow"
    - "workflows"
  max_structure_nodes: 250000
admission:
  deterministic_admission:
    enabled: true
    allowed_policy_sources:
      - missing_target_policy
