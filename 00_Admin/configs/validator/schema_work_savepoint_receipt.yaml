$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ai-ops:schema:work-savepoint-receipt:0.1.0
title: Work Savepoint Receipt
type: object
additionalProperties: false
required:
  - receipt_version
  - repo_root
  - repo_id
  - artifact_id
  - active_path
  - head
  - branch
  - include
  - include_set_sha256
  - future_work
  - status
  - created_at
properties:
  receipt_version: {const: "0.1.0"}
  repo_root: {type: string, minLength: 1}
  repo_id: {type: string, minLength: 1}
  artifact_id: {type: string, minLength: 1}
  active_path: {type: string, minLength: 1}
  head: {type: string, pattern: '^[0-9a-f]{40}$'}
  branch: {type: string, minLength: 1}
  include:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  include_set_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  future_work: {enum: [not_applicable, linked_only, completion_handoff, registry_sync]}
  status: {enum: [checkpointed, published]}
  created_at: {type: string, format: date-time}
