$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ai-ops:schema:execution-control-graph-run-state:0.1.0
title: Execution Control Graph Run State
type: object
additionalProperties: false
required:
  - state_version
  - authority
  - owner_id
  - graph_ref
  - graph_sha256
  - run_instance_id
  - status
  - completed_nodes
  - loop_counters
properties:
  state_version:
    const: "0.1.0"
  authority:
    const: derived_run_state_non_authoritative
  owner_id:
    # stable artifact_id of the runprogram/runbundle being executed
    type: string
    minLength: 1
  graph_ref:
    # convenience locator; owner_id + graph_sha256 are the authoritative binding
    type: string
    minLength: 1
  graph_sha256:
    type: string
    pattern: '^[a-f0-9]{64}$'
  run_instance_id:
    type: string
    minLength: 1
  status:
    enum: [running, complete, escalated, blocked]
  current_node:
    type: string
    minLength: 1
  completed_nodes:
    type: array
    items:
      type: string
      minLength: 1
  loop_counters:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [edge, count]
      properties:
        edge:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 0
  handoff_receipts:
    type: array
    items:
      type: string
      minLength: 1
  updated_at:
    type: string
x-ai-ops-invariants:
  - resumable run-instance state for an authored execution control graph
  - derived, non-authoritative; never redefines the graph or grants authority
  - graph_sha256 freezes the exact graph definition this run is executing
  - a running state names a current_node; loop counters never exceed max_cycles
