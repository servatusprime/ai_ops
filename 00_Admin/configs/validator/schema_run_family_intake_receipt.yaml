$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ai-ops:schema:run-family-intake-receipt:0.1.0
title: Run-Family Intake / Admission Receipt
type: object
additionalProperties: false
required:
  - receipt_version
  - authority
  - provider_id
  - source_snapshot
  - items
properties:
  receipt_version:
    const: "0.1.0"
  authority:
    const: derived_non_authoritative
  provider_id:
    type: string
    minLength: 1
  source_snapshot:
    $ref: "#/$defs/source_snapshot"
  items:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/item"
$defs:
  source_snapshot:
    type: object
    additionalProperties: false
    required: [package_sha256, inventory_ref]
    properties:
      package_sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
      inventory_ref:
        type: string
        minLength: 1
  item:
    type: object
    additionalProperties: false
    required: [name, disposition, provenance]
    properties:
      name:
        type: string
        minLength: 1
      disposition:
        enum: [admitted, conversion_required, reference_only, quarantine, unsupported, blocked]
      provenance:
        $ref: "#/$defs/provenance"
      evidence_ref:
        type: string
        minLength: 1
    allOf:
      - if:
          properties:
            disposition:
              enum: [admitted, conversion_required]
        then:
          required: [evidence_ref]
  provenance:
    type: object
    additionalProperties: false
    required: [source_path, content_sha256, size_bytes]
    properties:
      source_path:
        type: string
        minLength: 1
      content_sha256:
        type: string
        pattern: '^[a-f0-9]{64}$'
      size_bytes:
        type: integer
        minimum: 0
x-ai-ops-invariants:
  - every received item has exactly one disposition (nothing disappears silently)
  - every item carries provenance (source path, content hash, size)
  - admitted or converted items cite admission evidence
  - receipt is derived evidence and never authoritative geometry or data
