$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ai-ops:schema:closeout-approval:0.2.0
title: Closeout Approval
type: object
additionalProperties: false
required:
  - decision
  - run_id
  - packet_sha256
  - head
  - branch
  - projected_tree_sha256
  - include_set_sha256
  - mutation_plan_sha256
  - approved_by
  - approved_at
  - approval_ref
properties:
  decision: {const: approve}
  run_id: {type: string, format: uuid}
  packet_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  head: {type: string, pattern: '^[0-9a-f]{40}$'}
  branch: {type: string, minLength: 1}
  projected_tree_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  include_set_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  mutation_plan_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  approved_by: {type: string, minLength: 1}
  approved_at: {type: string, format: date-time}
  approval_ref: {type: string, minLength: 1}
