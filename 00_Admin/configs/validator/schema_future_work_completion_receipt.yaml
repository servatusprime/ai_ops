$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ai-ops:schema:future-work-completion-receipt:0.3.0
title: Future Work Completion Receipt
type: object
additionalProperties: false
required:
  - receipt_version
  - registry_id
  - run_id
  - status
  - exit_code
  - scope_sha256
  - completion_artifact_sha256
  - actor
  - started_at
  - completed_at
  - run_log_id
  - run_log_sha256
  - run_log_marker_sha256
  - scorecard_source_sha256
  - provenance_refs
  - review_refs
  - artifact_manifest
  - registry_deleted
  - receipt_sha256
properties:
  receipt_version: {const: "0.3.0"}
  registry_id: {type: string, pattern: '^fw_[0-9]{8}_[0-9]{2}$'}
  run_id: {type: string, format: uuid}
  status: {enum: [success, failed, pending, stale]}
  exit_code: {type: integer}
  scope_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  completion_artifact_sha256: {type: [string, "null"], pattern: '^[0-9a-f]{64}$'}
  actor: {type: string, minLength: 1}
  started_at: {type: string, format: date-time}
  completed_at: {type: string, format: date-time}
  completion_workbook: {type: [string, "null"]}
  completion_state:
    {type: [string, "null"], enum: [completed, ready_for_receipt, null]}
  run_log_id: {type: string, minLength: 1}
  run_log_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  run_log_marker_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  scorecard_source_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  provenance_refs: {type: array, items: {type: string, minLength: 1}}
  review_refs: {type: array, items: {type: string, minLength: 1}}
  artifact_manifest:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, sha256]
      properties:
        path: {type: string, minLength: 1}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  registry_entry_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  registry_deleted: {type: boolean}
  result: {type: [object, "null"]}
  receipt_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
