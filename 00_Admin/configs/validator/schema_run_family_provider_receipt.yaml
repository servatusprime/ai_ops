$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:ai-ops:schema:run-family-provider-receipt:0.1.0
title: Run-Family Provider Suitability Receipt
type: object
additionalProperties: false
required:
  - receipt_version
  - authority
  - provider_id
  - interface_version
  - entry_artifacts
  - exit_artifacts
  - validated_capabilities
  - known_limits
  - substantiated_by
properties:
  receipt_version:
    const: "0.1.0"
  authority:
    const: derived_non_authoritative
  provider_id:
    type: string
    minLength: 1
  interface_version:
    type: string
    pattern: '^(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*)){0,2}$'
  entry_artifacts:
    type: array
    items:
      type: string
      minLength: 1
  exit_artifacts:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  validated_capabilities:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/capability"
  known_limits:
    type: array
    items:
      type: string
  substantiated_by:
    $ref: "#/$defs/evidence_ref"
$defs:
  capability:
    type: object
    additionalProperties: false
    required: [capability, evidence_ref]
    properties:
      capability:
        type: string
        minLength: 1
      evidence_ref:
        type: string
        minLength: 1
  evidence_ref:
    type: object
    additionalProperties: false
    required: [kind, ref]
    properties:
      kind:
        enum: [run_instance_lock, run_receipt]
      ref:
        type: string
        minLength: 1
x-ai-ops-invariants:
  - receipt is optional; when present it must be complete and well-formed
  - receipt is derived evidence and never mints identity or redefines the interface
  - every validated capability cites observable evidence
  - substantiated_by references a run-instance lock or a run receipt
